e=\"button\">Vytlačiť menu<\/button><\/section><div class=\"container text-menu\"><section><h2>Slané croissanty<\/h2><article class=\"text-menu-item\"><div><h3><a href=\"produkt.html?id=croissant-sunka-syr\">Croissant šunka & syr<\/a><\/h3><p>Maslový croissant, kvalitná šunka, gouda a svieži šalát. Jednoduchá kombinácia na každé ráno.<\/p><small>180 g · Navrhované alergény: 1 – Obilniny obsahujúce lepok, 3 – Vajcia, 7 – Mlieko<\/small><\/div><strong>4,20 €<\/strong><\/article><article class=\"text-menu-item\"><div><h3><a href=\"produkt.html?id=croissant-mozzarella\">Croissant mozzarella<\/a><\/h3><p>Maslové cesto, mozzarella, paradajka a bazalkové pesto. Svieža slaná verzia bez mäsa.<\/p><small>190 g · Navrhované alergény: 1 – Obilniny obsahujúce lepok, 3 – Vajcia, 7 – Mlieko<\/small><\/div><strong>4,50 €<\/strong><\/article><article class=\"text-menu-item\"><div><h3><a href=\"produkt.html?id=croissant-losos\">Croissant s lososom<\/a><\/h3><p>Jemný krémový syr, údený losos, reďkovka a listový šalát v chrumkavom maslovom croissante.<\/p><small>200 g · Navrhované alergény: 1 – Obilniny obsahujúce lepok, 3 – Vajcia, 4 – Ryby, 7 – Mlieko<\/small><\/div><strong>5,40 €<\/strong><\/article><\/section><section><h2>Bagle<\/h2><article class=\"text-menu-item\"><div><h3><a href=\"produkt.html?id=bagel-losos\">Bagel s lososom<\/a><\/h3><p>Sezamový bagel s údeným lososom, krémovým syrom, uhorkou a kôprom. Jemne dochutený citrónom.<\/p><small>230 g · Navrhované alergény: 1 – Obilniny obsahujúce lepok, 4 – Ryby, 7 – Mlieko, 11 – Sezam<\/small><\/div><strong>5,60 €<\/strong><\/article><article class=\"text-menu-item\"><div><h3><a href=\"produkt.html?id=bagel-vajce-cedar\">Bagel vajce & cheddar<\/a><\/h3><p>Opečený sezamový bagel, vajíčko, cheddar a pažítkový krémový syr. Podávame teplý.<\/p><small>220 g · Navrhované alergény: 1 – Obilniny obsahujúce lepok, 3 – Vajcia, 7 – Mlieko, 11 – Sezam<\/small><\/div><strong>4,80 €<\/strong><\/article><article class=\"text-menu-item\"><div><h3><a href=\"produkt.html?id=bagel-avokado\">Bagel avokádo & rukola<\/a><\/h3><p>Avokádová nátierka s limetkou, rukola a sezamový bagel. Čisto rastlinná kombinácia.<\/p><small>220 g · Navrhované alergény: 1 – Obilniny obsahujúce lepok, 11 – Sezam<\/small><\/div><strong>4,90 €<\/strong><\/article><\/section><section><h2>Na tanieri<\/h2><article class=\"text-menu-item\"><div><h3><a href=\"produkt.html?id=vajicka-na-toaste\">Vajíčka na toaste<\/a><\/h3><p>Krémová praženica z troch vajec na opečenom kváskovom chlebe, pažítka a čerstvá zelenina.<\/p><small>250 g · Navrhované alergény: 1 – Obilniny obsahujúce lepok, 3 – Vajcia, 7 – Mlieko<\/small><\/div><strong>4,60 €<\/strong><\/article><article class=\"text-menu-item\"><div><h3><a href=\"produkt.html?id=jogurt-granola\">Jogurt, granola & ovocie<\/a><\/h3><p>Hustý grécky jogurt, ovsená granola s mandľami, sezónne ovocie a lyžička medu.<\/p><small>250 g · Navrhované alergény: 1 – Obilniny obsahujúce lepok, 7 – Mlieko, 8 – Orechy (mandle)<\/small><\/div><strong>3,80 €<\/strong><\/article><\/section><section><h2>Sladké<\/h2><article class=\"text-menu-item\"><div><h3><a href=\"produkt.html?id=skoricovy-slimak\">Škoricový slimák<\/a><\/h3><p>Mäkké kysnuté cesto, maslo, škorica a jemná smotanová poleva. Malá sladká bodka k ránu.<\/p><small>110 g · Navrhované alergény: 1 – Obilniny obsahujúce lepok, 3 – Vajcia, 7 – Mlieko<\/small><\/div><strong>2,80 €<\/strong><\/article><article class=\"text-menu-item\"><div><h3><a href=\"produkt.html?id=maslovy-croissant\">Maslový croissant<\/a><\/h3><p>Jemné vrstvené cesto s maslom, chrumkavý povrch a nič navyše. Ku káve alebo len tak.<\/p><small>75 g · Navrhované alergény: 1 – Obilniny obsahujúce lepok, 3 – Vajcia, 7 – Mlieko<\/small><\/div><strong>2,20 €<\/strong><\/article><article class=\"text-menu-item\"><div><h3><a href=\"produkt.html?id=mandlovy-croissant\">Mandľový croissant<\/a><\/h3><p>Maslový croissant plnený mandľovým krémom, posypaný plátkami mandlí a práškovým cukrom.<\/p><small> lue) ? sort.value : 'default'; renderMenu(); });\n    $('#reset-filters').addEventListener('click', () => {\n      clearTimeout(searchTimer);\n      menuState = { category:'vsetko', query:'', vegetarian:false, favorites:false, sort:'default' };\n      renderMenu(); searchInput.focus();\n    });\n    window.addEventListener('popstate', () => { menuState = stateFromURL(); renderMenu(); });\n    document.addEventListener('keydown', event => {\n      if (event.key === '/' && !event.metaKey && !event.ctrlKey && !event.altKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable) {\n        event.preventDefault(); searchInput.focus();\n      }\n    });\n  }\n\n  // Native dialog provides keyboard focus trapping and Escape semantics.\n  const quickDialog = document.createElement('dialog');\n  quickDialog.className = 'quick-dialog';\n  quickDialog.setAttribute('aria-labelledby','quick-title');\n  document.body.appendChild(quickDialog);\n  function openQuickView(id) {\n    const product = products.find(p => p.id === id);\n    if (!product) return;\n    quickDialog.innerHTML = `<button type=\"button\" class=\"icon-button dialog-close\" aria-label=\"Zatvori\\u0165 n\\u00e1h\\u013ead\" autofocus>${icon('close')}<\/button><div class=\"quick-dialog-grid\">${image(product,'quick-dialog-photo',true)}<div class=\"quick-dialog-copy\"><span class=\"eyebrow\">${escape(categories[product.category])} \\u00b7 ${escape(product.weight)}<\/span><h2 id=\"quick-title\">${escape(product.name)}<\/h2><p>${escape(product.description)}<\/p><span class=\"detail-price\">${money(product.price)}<\/span><p class=\"small-copy\">Navrhovan\\u00e9 alerg\\u00e9ny: ${product.allergens.length ? product.allergens.join(', ') : '\\u017eiadne v zlo\\u017een\\u00ed'}.<br>Fotografia je ilustra\\u010dn\\u00e1.<\/p><a href=\"${productUrl(product.id)}\" class=\"button\">Zlo\\u017eenie a cel\\u00fd detail ${icon('arrow')}<\/a><\/div><\/div>`;\n    $('.dialog-close',quickDialog).addEventListener('click', () => quickDialog.close());\n    if (typeof quickDialog.showModal === 'function') {\n      quickDialog.showModal(); document.body.classList.add('dialog-open');\n    } else { if (preview) preview.navigate(productUrl(id)); else window.location.href = productUrl(id); }\n  }\n  quickDialog.addEventListener('close', () => document.body.classList.remove('dialog-open'));\n  quickDialog.addEventListener('click', event => {\n    if (event.target !== quickDialog) return;\n    const box = quickDialog.getBoundingClientRect();\n    if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) quickDialog.close();\n  });\n\n  // Breakfast combo uses cents for exact arithmetic, and never submits an order.\n  const comboForm = $('#combo-form');\n  if (comboForm) {\n    const food = $('#combo-food');\n    const drink = $('#combo-drink');\n    const save = $('#combo-save');\n    const foodProducts = products.filter(p => p.category !== 'napoje');\n    const drinkProducts = products.filter(p => ['cappuccino','flat-white','espresso'].includes(p.id));\n    const option = p => `<option value=\"${p.id}\">${escape(p.name)} \\u00b7 ${money(p.price)}<\/option>`;\n    food.innerHTML = foodProducts.map(option).join('');\n    drink.innerHTML = drinkProducts.map(option).join('');\n    const stored = readStored(storageKeys.combo, null);\n    if (stored && typeof stored === 'object') {\n      if (foodProducts.some(p => p.id === stored.food)) food.value = stored.food;\n      if (drinkProducts.some(p => p.id === stored.drink)) drink.value = stored.drink;\n    }\n    function updateCombo() {\n      const main = foodProducts.find(p => p.id === food.value);\n      const beverage = drinkProducts.find(p => p.id === drink.value);\n      if (!main || !beverage) return;\n      const originalCents = Math.round(main.price*100) + Math.round(beverage.price*100);\n      $('#combo-price').textContent = money((originalCents - 70)/100);\n      $('#combo-original').textContent = money(originalCents/100);\n      const current = readStored(storageKeys.combo, null);\n      const saved = current && current.food === food.value && current.drink === drink.value;\n      save.innerHTML = `${saved ? 'Tvoj v\\u00fdber je ulo\\u017een\\u00fd' : 'Ulo\\u017ei\\u0165 m\\u00f4j v\\u00fdber'} ${icon(saved ? 'check' : 'heart')}`;\n    }\n    food.addEventListener('change',updateCombo);\n    drink.addEventListener('change',updateCombo);\n    comboForm.addEventListener('submit',event => event.preventDefault());\n    save.addEventListener('click',() => {\n      const persisted = store(storageKeys.combo, { food:food.value, drink:drink.value });\n      updateCombo();\n      toast(persisted ? 'Kombo je ulo\\u017een\\u00e9 v tomto prehliada\\u010di. Nie je to objedn\\u00e1vka.' : 'V\\u00fdber zostane iba po\\u010das tejto n\\u00e1v\\u0161tevy. Prehliada\\u010d blokuje ukladanie.');\n    });\n    updateCombo();\n  }\n\n  if (page === 'product') {\n    const id = new URLSearchParams(currentURL().search).get('id');\n    const product = products.find(p => p.id === id);\n    const target = $('#product-detail');\n    if (!product) {\n      target.innerHTML = `<div class=\"product-not-found\"><span class=\"eyebrow\">TAK\\u00ddTO PRODUKT TU NIE JE<\/span><h1>Vyber si nie\\u010do<br>z <em>n\\u00e1\\u0161ho menu.<\/em><\/h1><p>Odkaz je neplatn\\u00fd alebo sa produkt zmenil.<\/p><a href=\"menu.html\" class=\"button\">Sp\\u00e4\\u0165 do menu ${icon('arrow')}<\/a><\/div>`;\n      document.title = 'Produkt sa nena\\u0161iel | R\\u00c1NO.';\n    } else {\n      document.title = `${product.name} | R\\u00c1NO.`;\n      const description = $('meta[name=\"description\"]');\n      if (description) description.setAttribute('content',product.description);\n      const pair = products.find(p => p.id === product.pair);\n      const allergenMarkup = product.allergens.length ? product.allergens.map(a => `<span class=\"allergen-label\">${a} \\u2014 ${escape(allergens[a] || '')}<\/span>`).join(' ') : '<p>Navrhovan\\u00e9 zlo\\u017eenie neobsahuje deklarovan\\u00e9 alerg\\u00e9ny.<\/p>';\n      target.innerHTML = `<nav class=\"breadcrumbs\" aria-label=\"Navig\\u00e1cia v \\u0161trukt\\u00fare webu\"><a href=\"index.html\">Domov<\/a><span>/<\/span><a href=\"menu.html\">Na\\u0161e menu<\/a><span>/<\/span><a href=\"menu.html?kategoria=${product.category}\">${escape(categories[product.category])}<\/a><span>/<\/span><span>${escape(product.name)}<\/span><\/nav>\n      <div class=\"product-detail-grid\"><div class=\"product-detail-image\">${image(product,'',true)}<span class=\"image-caption\">Ilustra\\u010dn\\u00e1 fotografia. Navrhnut\\u00e1 recept\\u00fara sa m\\u00f4\\u017ee vizu\\u00e1lne l\\u00ed\\u0161i\\u0165.<\/span><\/div>\n      <div class=\"product-detail-copy\"><span class=\"eyebrow\">${escape(categories[product.category])}<\/span><h1>${escape(product.name)}<\/h1><div class=\"product-detail-meta\"><span>${escape(product.weight)}<\/span>${product.vegetarian ? `<span class=\"diet-tag\">${icon('leaf')} ${product.vegan ? 'Rastlinn\\u00e9' : 'Vegetari\\u00e1nske'}<\/span>` : ''}<\/div><span class=\"detail-price\">${money(product.price)}<\/span><p class=\"product-detail-description\">${escape(product.description)}<\/p>\n      <div class=\"detail-actions\"><button type=\"button\" class=\"button button-outline\" data-favorite=\"${product.id}\" aria-pressed=\"${favorites.has(product.id)}\"><span data-favorite-label>Ulo\\u017ei\\u0165 medzi ob\\u013e\\u00faben\\u00e9<\/span>${icon('heart')}<\/button><button type=\"button\" class=\"icon-button\" id=\"share-product\" aria-label=\"Skop\\u00edrova\\u0165 odkaz na produkt\">${icon('share')}<\/button><\/div><p class=\"not-order\">${icon('info')} Iba katal\\u00f3g. Navrhovan\\u00e1 cena, nie online objedn\\u00e1vka.<\/p>\n      <div class=\"ingredient-panel\"><details open><summary>\\u010co je vo vn\\u00fatri ${icon('chevron')}<\/summary><p>${product.ingredients.map(escape).join(' \\u00b7 ')}<\/p><\/details><details><summary>Navrhovan\\u00e9 alerg\\u00e9ny ${icon('chevron')}<\/summary><div>${allergenMarkup}<\/div><p class=\"allergen-warning\">\\u0160kolsk\\u00fd n\\u00e1vrh. Pred skuto\\u010dn\\u00fdm predajom je potrebn\\u00e9 overi\\u0165 recept\\u00fary, dod\\u00e1vate\\u013eov aj mo\\u017en\\u00fa kr\\u00ed\\u017eov\\u00fa kontamin\\u00e1ciu.<\/p><\/details><\/div>\n      ${pair ? `<a class=\"pair-box\" href=\"${productUrl(pair.id)}\">${image(pair)}<div><small>HOD\\u00cd SA K TOMU<\/small><strong>${escape(pair.name)}<\/strong><\/div><span>${money(pair.price)}<\/span>${icon('arrow-up')}<\/a>` : ''}<\/div><\/div>`;\n      updateFavorites();\n      $('#share-product').addEventListener('click',async () => {\n        const success = await copyText(preview ? window.parent.location.href : window.location.href);\n        toast(success ? 'Odkaz na produkt je skop\\u00edrovan\\u00fd.' : 'Kop\\u00edrovanie je zablokovan\\u00e9. Skop\\u00edruj odkaz z adresn\\u00e9ho riadka.');\n      });\n      const related = [...products.filter(p => p.category === product.category && p.id !== product.id), ...products.filter(p => p.featured && p.id !== product.id && p.category !== product.category)].slice(0,4);\n      $('#related-products').innerHTML = related.map(card).join('');\n      $('#related-section').hidden = false;\n    }\n  }\n\n  async function copyText(text) {\n    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (_) { /* try legacy selection */ }\n    const textarea = document.createElement('textarea');\n    textarea.value = text; textarea.setAttribute('readonly','');\n    textarea.style.cssText = 'position:fixed;left:-9999px;top:0';\n    document.body.appendChild(textarea);\n    const active = document.activeElement;\n    textarea.select();\n    let copied = false;\n    try { copied = document.execCommand('copy'); } catch (_) { copied = false; }\n    textarea.remove();\n    if (active && typeof active.focus === 'function') active.focus();\n    return copied;\n  }\n  const addressButton = $('#copy-address');\n  if (addressButton) addressButton.addEventListener('click', async () => {\n    const copied = await copyText('Ekonomick\\u00e1 fakulta UMB, Tajovsk\\u00e9ho 10, 975 90 Bansk\\u00e1 Bystrica');\n    toast(copied ? 'Adresa fakulty je skop\\u00edrovan\\u00e1.' : 'Kop\\u00edrovanie je zablokovan\\u00e9. Adresu m\\u00f4\\u017ee\\u0161 ozna\\u010di\\u0165 a skop\\u00edrova\\u0165 ru\\u010dne.');\n  });\n  const mapButton = $('#load-map');\n  if (mapButton) mapButton.addEventListener('click', () => {\n    const iframe = document.createElement('iframe');\n    iframe.title = 'Mapa Ekonomickej fakulty UMB, Tajovsk\\u00e9ho 10';\n    iframe.referrerPolicy = 'no-referrer';\n    iframe.src = 'https://www.openstreetmap.org/export/embed.html?bbox=19.1328%2C48.7362%2C19.1430%2C48.7410&layer=mapnik&marker=48.738708%2C19.137851';\n    iframe.loading = 'eager';\n    const parent = $('.map-preview');\n    parent.replaceChildren(iframe);\n    iframe.focus();\n    // A permanent external link remains available below the map if embedding is blocked.\n  });\n  const clearButton = $('#clear-storage');\n  if (clearButton) clearButton.addEventListener('click',() => {\n    let success = true;\n    Object.values(storageKeys).forEach(key => {\n      memory.delete(key);\n      try { persistentStorage().removeItem(key); } catch (_) { success = false; }\n    });\n    favorites = new Set(); updateFavorites();\n    toast(success ? 'Ob\\u013e\\u00faben\\u00e9 polo\\u017eky aj ulo\\u017een\\u00e9 kombo s\\u00fa vymazan\\u00e9.' : 'Vo\\u013eby tejto n\\u00e1v\\u0161tevy s\\u00fa vymazan\\u00e9. K \\u00falo\\u017eisku prehliada\\u010da nie je pr\\u00edstup.');\n  });\n  const printButton = $('#print-menu');\n  if (printButton) printButton.addEventListener('click', () => window.print());\n})();\n<\/script><\/body><\/html>", "produkt.html": "<!doctyp composedPath().includes(header)) closeNav();\n    });\n  }\n  const header = $('.site-header');\n  if (header) {\n    const updateHeader = () => header.classList.toggle('is-scrolled', window.scrollY > 20);\n    window.addEventListener('scroll', updateHeader, { passive:true });\n    updateHeader();\n  }\n\n  const featuredGrid = $('[data-featured]');\n  if (featuredGrid) featuredGrid.innerHTML = products.filter(p => p.featured).map(card).join('');\n\n  // Catalog filters are reflected in the URL and can be shared/bookmarked.\n  if (page === 'menu') {\n    const searchInput = $('#menu-search');\n    const grid = $('#menu-grid');\n    const empty = $('#empty-state');\n    const vegetarianButton = $('#vegetarian-filter');\n    const favoritesButton = $('#favorites-filter');\n    const sort = $('#menu-sort');\n    const validSorts = new Set(['default','price-asc','price-desc','name']);\n    function stateFromURL() {\n      const params = new URLSearchParams(currentURL().search);\n      const category = params.get('kategoria');\n      const order = params.get('zoradenie');\n      return { category:categories[category] ? category : 'vsetko', query:(params.get('hladat') || '').slice(0,100), vegetarian:params.get('vegetarianske') === '1', favorites:params.get('oblubene') === '1', sort:validSorts.has(order) ? order : 'default' };\n    }\n    function updateURL() {\n      const params = new URLSearchParams();\n      if (menuState.category !== 'vsetko') params.set('kategoria', menuState.category);\n      if (menuState.query) params.set('hladat', menuState.query);\n      if (menuState.vegetarian) params.set('vegetarianske', '1');\n      if (menuState.favorites) params.set('oblubene', '1');\n      if (menuState.sort !== 'default') params.set('zoradenie', menuState.sort);\n      const query = params.toString();\n      try {\n        const next = `menu.html${query ? '?' + query : ''}${currentURL().hash}`;\n        if (preview) preview.updateURL(next);\n        else history.replaceState(null, '', next);\n      } catch (_) { /* file:// previews may restrict History API */ }\n    }\n    renderMenu = () => {\n      let visible = products.filter(product => {\n        if (menuState.category !== 'vsetko' && product.category !== menuState.category) return false;\n        if (menuState.vegetarian && !product.vegetarian) return false;\n        if (menuState.favorites && !favorites.has(product.id)) return false;\n        const haystack = normalized(`${product.name} ${product.description} ${product.ingredients.join(' ')} ${categories[product.category]}`);\n        return !menuState.query.trim() || normalized(menuState.query.trim()).split(/\\s+/).every(word => haystack.includes(word));\n      });\n      if (menuState.sort === 'price-asc') visible.sort((a,b) => a.price - b.price);\n      if (menuState.sort === 'price-desc') visible.sort((a,b) => b.price - a.price);\n      if (menuState.sort === 'name') visible.sort((a,b) => a.name.localeCompare(b.name,'sk'));\n      grid.innerHTML = visible.map(card).join('');\n      grid.hidden = visible.length === 0;\n      empty.hidden = visible.length !== 0;\n      $('#result-count').textContent = `Zobrazen\\u00e9: ${visible.length} / ${products.length}`;\n      $('#empty-message').textContent = menuState.favorites && favorites.size === 0 ? 'Zatia\\u013e nem\\u00e1\\u0161 ulo\\u017een\\u00e9 \\u017eiadne jedlo. Pridaj si ho kliknut\\u00edm na srdie\\u010dko pri produkte.' : 'Sk\\u00fas in\\u00fd v\\u00fdraz alebo zru\\u0161 niektor\\u00fd filter.';\n      $$('[data-category]').forEach(button => {\n        const active = button.dataset.category === menuState.category;\n        button.classList.toggle('active', active);\n        button.setAttribute('aria-pressed', String(active));\n      });\n      vegetarianButton.setAttribute('aria-pressed', String(menuState.vegetarian));\n      favoritesButton.setAttribute('aria-pressed', String(menuState.favorites));\n      if (searchInput.value !== menuState.query) searchInput.value = menuState.query;\n      sort.value = menuState.sort;\n      updateURL();\n    };\n    menuState = stateFromURL();\n    renderMenu();\n    $$('[data-category]').forEach(button => button.addEventListener('click', () => {\n      menuState.category = button.dataset.category;\n      renderMenu();\n    }));\n    let searchTimer;\n    searchInput.addEventListener('input', () => {\n      clearTimeout(searchTimer);\n      menuState.query = searchInput.value.slice(0,100);\n      searchTimer = setTimeout(renderMenu, 100);\n    });\n    vegetarianButton.addEventListener('click', () => { menuState.vegetarian = !menuState.vegetarian; renderMenu(); });\n    favoritesButton.addEventListener('click', () => { menuState.favorites = !menuState.favorites; renderMenu(); });\n    sort.addEventListener('change', () => { menuState.sort = validSorts.has(sort.value) ? sort.value : 'default'; renderMenu(); });\n    $('#reset-filters').addEventListener('click', () => {\n      clearTimeout(searchTimer);\n      menuState = { category:'vsetko', query:'', vegetarian:false, favorites:false, sort:'default' };\n      renderMenu(); searchInput.focus();\n    });\n    window.addEventListener('popstate', () => { menuState = stateFromURL(); renderMenu(); });\n    document.addEventListener('keydown', event => {\n      if (event.key === '/' && !event.metaKey && !event.ctrlKey && !event.altKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable) {\n        event.preventDefault(); searchInput.focus();\n      }\n    });\n  }\n\n  // Native dialog provides keyboard focus trapping and Escape semantics.\n  const quickDialog = document.createElement('dialog');\n  quickDialog.className = 'quick-dialog';\n  quickDialog.setAttribute('aria-labelledby','quick-title');\n  document.body.appendChild(quickDialog);\n  function openQuickView(id) {\n    const product = products.find(p => p.id === id);\n    if (!product) return;\n    quickDialog.innerHTML = `<button type=\"button\" class=\"icon-button dialog-close\" aria-label=\"Zatvori\\u0165 n\\u00e1h\\u013ead\" autofocus>${icon('close')}<\/button><div class=\"quick-dialog-grid\">${image(product,'quick-dialog-photo',true)}<div class=\"quick-dialog-copy\"><span class=\"eyebrow\">${escape(categories[product.category])} \\u00b7 ${escape(product.weight)}<\/span><h2 id=\"quick-title\">${escape(product.name)}<\/h2><p>${escape(product.description)}<\/p><span class=\"detail-price\">${money(product.price)}<\/span><p class=\"small-copy\">Navrhovan\\u00e9 alerg\\u00e9ny: ${product.allergens.length ? product.allergens.join(', ') : '\\u017eiadne v zlo\\u017een\\u00ed'}.<br>Fotografia je ilustra\\u010dn\\u00e1.<\/p><a href=\"${productUrl(product.id)}\" class=\"button\">Zlo\\u017eenie a cel\\u00fd detail ${icon('arrow')}<\/a><\/div><\/div>`;\n    $('.dialog-close',quickDialog).addEventListener('click', () => quickDialog.close());\n    if (typeof quickDialog.showModal === 'function') {\n      quickDialog.showModal(); document.body.classList.add('dialog-open');\n    } else { if (preview) preview.navigate(productUrl(id)); else window.location.href = productUrl(id); }\n  }\n  quickDialog.addEventListener('close', () => document.body.classList.remove('dialog-open'));\n  quickDialog.addEventListener('click', event => {\n    if (event.target !== quickDialog) return;\n    const box = quickDialog.getBoundingClientRect();\n    if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) quickDialog.close();\n  });\n\n  // Breakfast combo uses cents for exact arithmetic, and never submits an order.\n  const comboForm = $('#combo-form');\n  if (comboForm) {\n    const food = $('#combo-food');\n    const drink = $('#combo-drink');\n    const save = $('#combo-save');\n    const foodProducts = products.filter(p => p.category !== 'napoje');\n    const drinkProducts = products.filter(p => ['cappuccino','flat-white','espresso'].includes(p.id));\n    const option = p => `<option value=\"${p.id}\">${escape(p.name)} \\u00b7 ${money(p.price)}<\/option>`;\n    food.innerHTML = foodProducts.map(option).join('');\n    drink.innerHTML = drinkProducts.map(option).join('');\n    const stored = readStored(storageKeys.combo, null);\n    if (stored && typeof stored === 'object') {\n      if (foodProducts.some(p => p.id === stored.food)) food.value = stored.food;\n      if (drinkProducts.some(p => p.id === stored.drink)) drink.value = stored.drink;\n    }\n    function updateCombo() {\n      const main = foodProducts.find(p => p.id === food.value);\n      const beverage = drinkProducts.find(p => p.id === drink.value);\n      if (!main || !beverage) return;\n      const originalCents = Math.round(main.price*100) + Math.round(beverage.price*100);\n      $('#combo-price').textContent = money((originalCents - 70)/100);\n      $('#combo-original').textContent = money(originalCents/100);\n      const current = readStored(storageKeys.combo, null);\n      const saved = current && current.food === food.value && current.drink === drink.value;\n      save.innerHTML = `${saved ? 'Tvoj v\\u00fdber je ulo\\u017een\\u00fd' : 'Ulo\\u017ei\\u0165 m\\u00f4j v\\u00fdber'} ${icon(saved ? 'check' : 'heart')}`;\n    }\n    food.addEventListener('change',updateCombo);\n    drink.addEventListener('change',updateCombo);\n    comboForm.addEventListener('submit',event => event.preventDefault());\n    save.addEventListener('click',() => {\n      const persisted = store(storageKeys.combo, { food:food.value, drink:drink.value });\n      updateCombo();\n      toast(persisted ? 'Kombo je ulo\\u017een\\u00e9 v tomto prehliada\\u010di. Nie je to objedn\\u00e1vka.' : 'V\\u00fdber zostane iba po\\u010das tejto n\\u00e1v\\u0161tevy. Prehliada\\u010d blokuje ukladanie.');\n    });\n    updateCombo();\n  }\n\n  if (page === 'product') {\n    const id = new URLSearchParams(currentURL().search).get('id');\n    const product = products.find(p => p.id === id);\n    const target = $('#product-detail');\n    if (!product) {\n      target.innerHTML = `<div class=\"product-not-found\"><span class=\"eyebrow\">TAK\\u00ddTO PRODUKT TU NIE JE<\/span><h1>Vyber si nie\\u010do<br>z <em>n\\u00e1\\u0161ho menu.<\/em><\/h1><p>Odkaz je neplatn\\u00fd alebo sa produkt zmenil.<\/p><a href=\"menu.html\" class=\"button\">Sp\\u00e4\\u0165 do menu ${icon('arrow')}<\/a><\/div>`;\n      document.title = 'Produkt sa nena\\u0161iel | R\\u00c1NO.';\n    } else {\n      document.title = `${product.name} | R\\u00c1NO.`;\n      const description = $('meta[name=\"description\"]');\n      if (description) description.setAttribute('content',product.description);\n      const pair = products.find(p => p.id === product.pair);\n      const allergenMarkup = product.allergens.length ? product.allergens.map(a => `<span class=\"allergen-label\">${a} \\u2014 ${escape(allergens[a] || '')}<\/span>`).join(' ') : '<p>Navrhovan\\u00e9 zlo\\u017eenie neobsahuje deklarovan\\u00e9 alerg\\u00e9ny.<\/p>';\n      target.innerHTML = `<nav class=\"breadcrumbs\" aria-label=\"Navig\\u00e1cia v \\u0161trukt\\u00fare webu\"><a href=\"index.html\">Domov<\/a><span>/<\/span><a href=\"menu.html\">Na\\u0161e menu<\/a><span>/<\/span><a href=\"menu.html?kategoria=${product.category}\">${escape(categories[product.category])}<\/a><span>/<\/span><span>${escape(product.name)}<\/span><\/nav>\n      <div class=\"product-detail-grid\"><div class=\"product-detail-image\">${image(product,'',true)}<span class=\"image-caption\">Ilustra\\u010dn\\u00e1 fotografia. Navrhnut\\u00e1 recept\\u00fara sa m\\u00f4\\u017ee vizu\\u00e1lne l\\u00ed\\u0161i\\u0165.<\/span><\/div>\n      <div class=\"product-detail-copy\"><span class=\"eyebrow\">${escape(categories[product.category])}<\/span><h1>${escape(product.name)}<\/h1><div class=\"product-detail-meta\"><span>${escape(product.weight)}<\/span>${product.vegetarian ? `<span class=\"diet-tag\">${icon('leaf')} ${product.vegan ? 'Rastlinn\\u00e9' : 'Vegetari\\u00e1nske'}<\/span>` : ''}<\/div><span class=\"detail-price\">${money(product.price)}<\/span><p class=\"product-detail-description\">${escape(product.description)}<\/p>\n      <div class=\"detail-actions\"><button type=\"button\" class=\"button button-outline\" data-favorite=\"${product.id}\" aria-pressed=\"${favorites.has(product.id)}\"><span data-favorite-label>Ulo\\u017ei\\u0165 medzi ob\\u013e\\u00faben\\u00e9<\/span>${icon('heart')}<\/button><button type=\"button\" class=\"icon-button\" id=\"share-product\" aria-label=\"Skop\\u00edrova\\u0165 odkaz na produkt\">${icon('share')}<\/button><\/div><p class=\"not-order\">${icon('info')} Iba katal\\u00f3g. Navrhovan\\u00e1 cena, nie online objedn\\u00e1vka.<\/p>\n      <div class=\"ingredient-panel\"><details open><summary>\\u010co je vo vn\\u00fatri ${icon('chevron')}<\/summary><p>${product.ingredients.map(escape).join(' \\u00b7 ')}<\/p><\/details><details><summary>Navrhovan\\u00e9 alerg\\u00e9ny ${icon('chevron')}<\/summary><div>${allergenMarkup}<\/div><p class=\"allergen-warning\">\\u0160kolsk\\u00fd n\\u00e1vrh. Pred skuto\\u010dn\\u00fdm predajom je potrebn\\u00e9 overi\\u0165 recept\\u00fary, dod\\u00e1vate\\u013eov aj mo\\u017en\\u00fa kr\\u00ed\\u017eov\\u00fa kontamin\\u00e1ciu.<\/p><\/details><\/div>\n      ${pair ? `<a class=\"pair-box\" href=\"${productUrl(pair.id)}\">${image(pair)}<div><small>HOD\\u00cd SA K TOMU<\/small><strong>${escape(pair.name)}<\/strong><\/div><span>${money(pair.price)}<\/span>${icon('arrow-up')}<\/a>` : ''}<\/div><\/div>`;\n      updateFavorites();\n      $('#share-product').addEventListener('click',async () => {\n        const success = await copyText(preview ? window.parent.location.href : window.location.href);\n        toast(success ? 'Odkaz na produkt je skop\\u00edrovan\\u00fd.' : 'Kop\\u00edrovanie je zablokovan\\u00e9. Skop\\u00edruj odkaz z adresn\\u00e9ho riadka.');\n      });\n      const related = [...products.filter(p => p.category === product.category && p.id !== product.id), .. und\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12h15M13 5l7 7-7 7\"/><\/svg><\/a><a href=\"index.html#kombo\">Raňajkové kombo<svg class=\"icon \" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12h15M13 5l7 7-7 7\"/><\/svg><\/a><a href=\"o-nas.html\" aria-current=\"page\">O nás<svg class=\"icon \" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12h15M13 5l7 7-7 7\"/><\/svg><\/a><a href=\"kontakt.html\">Kde nás nájdeš<svg class=\"icon \" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12h15M13 5l7 7-7 7\"/><\/svg><\/a><p>EF UMB · Tajovského 10, Banská Bystrica<\/p><\/nav><\/header><main id=\"main\"><section class=\"page-intro container\"><nav class=\"breadcrumbs\" aria-label=\"Navigácia v štruktúre webu\"><a href=\"index.html\">Domov<\/a><span>/<\/span><span>O nás<\/span><\/nav><span class=\"eyebrow\">MYŠLIENKA ZA RÁNOM<\/span><h1>Raňajky patria<br>do <em>rozvrhu.<\/em><\/h1><p class=\"intro-description\">Nie vždy sa zmestia medzi budík, cestu a prvú prednášku.<br>Preto sme pre ne navrhli miesto priamo na fakulte.<\/p><\/section><div class=\"container wide-photo\"><img src=\"https://images.pexels.com/photos/30455362/pexels-photo-30455362.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1800\" alt=\"Inšpirácia interiéru raňajkárne s prírodnými materiálmi\" class=\"\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" referrerpolicy=\"no-referrer\"><span class=\"image-caption\">Vizuálna inšpirácia. Nie fotografia priestorov EF UMB.<\/span><\/div><section class=\"section container story-grid\"><div><span class=\"eyebrow\">NÁŠ KONCEPT<\/span><h2>Na fakulte.<br><em>Pre každého.<\/em><\/h2><\/div><div class=\"story-copy\"><p class=\"lead\">RÁNO. je študentský návrh raňajkárne v objekte Ekonomickej fakulty Univerzity Mateja Bela v Banskej Bystrici.<\/p><p>Miesto, kde si študent vezme bagel pred seminárom, vyučujúci sa zastaví na kávu a ktokoľvek z okolia si môže sadnúť k raňajkám.<\/p><p>Základom ponuky sú slané croissanty a plnené bagle. Dopĺňa ich sladké pečivo, vajíčka, jogurt s granolou, káva, čaj a čerstvá šťava. Chceme stavať na čerstvých surovinách a spolupráci s lokálnymi pekármi.<\/p><\/div><\/section><section class=\"section section-tinted\"><div class=\"container\"><span class=\"eyebrow\">NA ČOM STAVIAME<\/span><div class=\"values-grid\"><article><span class=\"value-number\">01<\/span><svg class=\"icon \" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 7h14l1 14H4L5 7ZM8 7V6a4 4 0 0 1 8 0v1\"/><\/svg><h3>Aj keď sa ponáhľaš.<\/h3><p>Prehľadná ponuka a rýchly výdaj. Raňajky so sebou bez zbytočnej zachádzky mimo fakulty.<\/p><\/article><article><span class=\"value-number\">02<\/span><svg class=\"icon \" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 8h12v7a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8ZM16 9h2a3 3 0 0 1 0 6h-2M3 23h15M7 2v2M12 2v2\"/><\/svg><h3>Raňajky, nie rozpočet.<\/h3><p>Dostupné ceny a zvýhodnené kombinácie jedla s kávou. Aby sa sem dalo vracať aj cez týždeň.<\/p><\/article><article><span class=\"value-number\">03<\/span><svg class=\"icon \" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 18h20M6 18a6 6 0 0 1 12 0M12 2v4M3.5 7.5l3 3M20.5 7.5l-3 3M1 13h3M20 13h3\"/><\/svg><h3>Chvíľa pri jednom stole.<\/h3><p>Priestor na stretnutie medzi prednáškami. Pre študentov, vyučujúcich aj ranných okoloidúcich.<\/p><\/article><\/div><\/div><\/section><section class=\"section container about-preview\"><div class=\"about-preview-photo\"><img src=\"https://images.pexels.com/photos/3957501/pexels-photo-3957501.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1400\" alt=\"Bagel plnený lososom a krémovým syrom\" class=\"\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><\/div><div class=\"about-preview-copy\"><span class=\"eyebrow\">MENEJ KOMPLIKÁCIÍ. VIAC CHUTI.<\/span><h2>Slané má<br><em>hlavné slovo.<\/em><\/h2><p>Chrumkavé vrstvy croissantu alebo opečený sezamový bagel. Klasika so šunkou a syrom, jemný losos aj rastlinné avokádo.<\/p><p>Pri každom jedle uvádzame zloženie a navrhované alergény. Vybrať si má byť jednoduché.<\/p><a href=\"menu.html\" class=\"button\">Pozrieť naše menu <svg class=\"icon \" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12h15M13 5l7 7-7 7\"/><\/svg><\/a><\/div><\/section><\/main><footer class=\"site-footer\"><div class=\"container footer-main\"><div class=\"footer-intro\"><a href=\"index.html\" class=\"brand footer-brand\" aria-label=\"RÁNO. — domov\">ráno<span>.<\/span><\/a><p>Raňajky. Káva. Chvíľa pre seba.<\/p><p class=\"footer-muted\">Na fakulte, ešte pred prvou prednáškou.<\/p><\/div><div><h3>Ochutnaj<\/h3><a href=\"menu.html?kategoria=croissanty\">Slané croissanty<\/a><a href=\"menu.html?kategoria=bagle\">Plnené bagle<\/a><a href=\"menu.html?kategoria=sladke\">Niečo sladké<\/a><a href=\"menu.html?kategoria=napoje\">Káva a nápoje<\/a><\/div><div><h3>Zastav sa<\/h3><a href=\"kontakt.html\">EF UMB, Tajovského 10<br>Banská Bystrica<\/a><p>Po–Pi · 7:00–14:00<br><span class=\"footer-muted\">Návrh otváracích hodín<\/span><\/p><\/div><a class=\"footer-top icon-button\" href=\"#top\" aria-label=\"Späť hore\"><svg class=\"icon \" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\" > {\n        const active = button.dataset.category === menuState.category;\n        button.classList.toggle('active', active);\n        button.setAttribute('aria-pressed', String(active));\n      });\n      vegetarianButton.setAttribute('aria-pressed', String(menuState.vegetarian));\n      favoritesButton.setAttribute('aria-pressed', String(menuState.favorites));\n      if (searchInput.value !== menuState.query) searchInput.value = menuState.query;\n      sort.value = menuState.sort;\n      updateURL();\n    };\n    menuState = stateFromURL();\n    renderMenu();\n    $$('[data-category]').forEach(button => button.addEventListener('click', () => {\n      menuState.category = button.dataset.category;\n      renderMenu();\n    }));\n    let searchTimer;\n    searchInput.addEventListener('input', () => {\n      clearTimeout(searchTimer);\n      menuState.query = searchInput.value.slice(0,100);\n      searchTimer = setTimeout(renderMenu, 100);\n    });\n    vegetarianButton.addEventListener('click', () => { menuState.vegetarian = !menuState.vegetarian; renderMenu(); });\n    favoritesButton.addEventListener('click', () => { menuState.favorites = !menuState.favorites; renderMenu(); });\n    sort.addEventListener('change', () => { menuState.sort = validSorts.has(sort.value) ? sort.value : 'default'; renderMenu(); });\n    $('#reset-filters').addEventListener('click', () => {\n      clearTimeout(searchTimer);\n      menuState = { category:'vsetko', query:'', vegetarian:false, favorites:false, sort:'default' };\n      renderMenu(); searchInput.focus();\n    });\n    window.addEventListener('popstate', () => { menuState = stateFromURL(); renderMenu(); });\n    document.addEventListener('keydown', event => {\n      if (event.key === '/' && !event.metaKey && !event.ctrlKey && !event.altKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable) {\n        event.preventDefault(); searchInput.focus();\n      }\n    });\n  }\n\n  // Native dialog provides keyboard focus trapping and Escape semantics.\n  const quickDialog = document.createElement('dialog');\n  quickDialog.className = 'quick-dialog';\n  quickDialog.setAttribute('aria-labelledby','quick-title');\n  document.body.appendChild(quickDialog);\n  function openQuickView(id) {\n    const product = products.find(p => p.id === id);\n    if (!product) return;\n    quickDialog.innerHTML = `<button type=\"button\" class=\"icon-button dialog-close\" aria-label=\"Zatvori\\u0165 n\\u00e1h\\u013ead\" autofocus>${icon('close')}<\/button><div class=\"quick-dialog-grid\">${image(product,'quick-dialog-photo',true)}<div class=\"quick-dialog-copy\"><span class=\"eyebrow\">${escape(categories[product.category])} \\u00b7 ${escape(product.weight)}<\/span><h2 id=\"quick-title\">${escape(product.name)}<\/h2><p>${escape(product.description)}<\/p><span class=\"detail-price\">${money(product.price)}<\/span><p class=\"small-copy\">Navrhovan\\u00e9 alerg\\u00e9ny: ${product.allergens.length ? product.allergens.join(', ') : '\\u017eiadne v zlo\\u017een\\u00ed'}.<br>Fotografia je ilustra\\u010dn\\u00e1.<\/p><a href=\"${productUrl(product.id)}\" class=\"button\">Zlo\\u017eenie a cel\\u00fd detail ${icon('arrow')}<\/a><\/div><\/div>`;\n    $('.dialog-close',quickDialog).addEventListener('click', () => quickDialog.close());\n    if (typeof quickDialog.showModal === 'function') {\n      quickDialog.showModal(); document.body.classList.add('dialog-open');\n    } else { if (preview) preview.navigate(productUrl(id)); else window.location.href = productUrl(id); }\n  }\n  quickDialog.addEventListener('close', () => document.body.classList.remove('dialog-open'));\n  quickDialog.addEventListener('click', event => {\n    if (event.target !== quickDialog) return;\n    const box = quickDialog.getBoundingClientRect();\n    if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) quickDialog.close();\n  });\n\n  // Breakfast combo uses cents for exact arithmetic, and never submits an order.\n  const comboForm = $('#combo-form');\n  if (comboForm) {\n    const food = $('#combo-food');\n    const drink = $('#combo-drink');\n    const save = $('#combo-save');\n    const foodProducts = products.filter(p => p.category !== 'napoje');\n    const drinkProducts = products.filter(p => ['cappuccino','flat-white','espresso'].includes(p.id));\n    const option = p => `<option value=\"${p.id}\">${escape(p.name)} \\u00b7 ${money(p.price)}<\/option>`;\n    food.innerHTML = foodProducts.map(option).join('');\n    drink.innerHTML = drinkProducts.map(option).join('');\n    const stored = readStored(storageKeys.combo, null);\n    if (stored && typeof stored === 'object') {\n      if (foodProducts.some(p => p.id === stored.food)) food.value = stored.food;\n      if (drinkProducts.some(p => p.id === stored.drink)) drink.value = stored.drink;\n    }\n    function updateCombo() {\n      const main = foodProducts.find(p => p.id === food.value);\n      const beverage = drinkProducts.find(p => p.id === drink.value);\n      if (!main || !beverage) return;\n      const originalCents = Math.round(main.price*100) + Math.round(beverage.price*100);\n      $('#combo-price').textContent = money((originalCents - 70)/100);\n      $('#combo-original').textContent = money(originalCents/100);\n      const current = readStored(storageKeys.combo, null);\n      const saved = current && current.food === food.value && current.drink === drink.value;\n      save.innerHTML = `${saved ? 'Tvoj v\\u00fdber je ulo\\u017een\\u00fd' : 'Ulo\\u017ei\\u0165 m\\u00f4j v\\u00fdber'} ${icon(saved ? 'check' : 'heart')}`;\n    }\n    food.addEventListener('change',updateCombo);\n    drink.addEventListener('change',updateCombo);\n    comboForm.addEventListener('submit',event => event.preventDefault());\n    save.addEventListener('click',() => {\n      const persisted = store(storageKeys.combo, { food:food.value, drink:drink.value });\n      updateCombo();\n      toast(persisted ? 'Kombo je ulo\\u017een\\u00e9 v tomto prehliada\\u010di. Nie je to objedn\\u00e1vka.' : 'V\\u00fdber zostane iba po\\u010das tejto n\\u00e1v\\u0161tevy. Prehliada\\u010d blokuje ukladanie.');\n    });\n    updateCombo();\n  }\n\n  if (page === 'product') {\n    const id = new URLSearchParams(currentURL().search).get('id');\n    const product = products.find(p => p.id === id);\n    const target = $('#product-detail');\n    if (!product) {\n      target.innerHTML = `<div class=\"product-not-found\"><span class=\"eyebrow\">TAK\\u00ddTO PRODUKT TU NIE JE<\/span><h1>Vyber si nie\\u010do<br>z <em>n\\u00e1\\u0161ho menu.<\/em><\/h1><p>Odkaz je neplatn\\u00fd alebo sa produkt zmenil.<\/p><a href=\"menu.html\" class=\"button\">Sp\\u00e4\\u0165 do menu ${icon('arrow')}<\/a><\/div>`;\n      document.title = 'Produkt sa nena\\u0161iel | R\\u00c1NO.';\n    } else {\n      document.title = `${product.name} | R\\u00c1NO.`;\n      const description = $('meta[name=\"description\"]');\n      if (description) description.setAttribute('content',product.description);\n      const pair = products.find(p => p.id === product.pair);\n      const allergenMarkup = product.allergens.length ? product.allergens.map(a => `<span class=\"allergen-label\">${a} \\u2014 ${escape(allergens[a] || '')}<\/span>`).join(' ') : '<p>Navrhovan\\u00e9 zlo\\u017eenie neobsahuje deklarovan\\u00e9 alerg\\u00e9ny.<\/p>';\n      target.innerHTML = `<nav class=\"breadcrumbs\" aria-label=\"Navig\\u00e1cia v \\u0161trukt\\u00fare webu\"><a href=\"index.html\">Domov<\/a><span>/<\/span><a href=\"menu.html\">Na\\u0161e menu<\/a><span>/<\/span><a href=\"menu.html?kategoria=${product.category}\">${escape(categories[product.category])}<\/a><span>/<\/span><span>${escape(product.name)}<\/span><\/nav>\n      <div class=\"product-detail-grid\"><div class=\"product-detail-image\">${image(product,'',true)}<span class=\"image-caption\">Ilustra\\u010dn\\u00e1 fotografia. Navrhnut\\u00e1 recept\\u00fara sa m\\u00f4\\u017ee vizu\\u00e1lne l\\u00ed\\u0161i\\u0165.<\/span><\/div>\n      <div class=\"product-detail-copy\"><span class=\"eyebrow\">${escape(categories[product.category])}<\/span><h1>${escape(product.name)}<\/h1><div class=\"product-detail-meta\"><span>${escape(product.weight)}<\/span>${product.vegetarian ? `<span class=\"diet-tag\">${icon('leaf')} ${product.vegan ? 'Rastlinn\\u00e9' : 'Vegetari\\u00e1nske'}<\/span>` : ''}<\/div><span class=\"detail-price\">${money(product.price)}<\/span><p class=\"product-detail-description\">${escape(product.description)}<\/p>\n      <div class=\"detail-actions\"><button type=\"button\" class=\"button button-outline\" data-favorite=\"${product.id}\" aria-pressed=\"${favorites.has(product.id)}\"><span data-favorite-label>Ulo\\u017ei\\u0165 medzi ob\\u013e\\u00faben\\u00e9<\/span>${icon('heart')}<\/button><button type=\"button\" class=\"icon-button\" id=\"share-product\" aria-label=\"Skop\\u00edrova\\u0165 odkaz na produkt\">${icon('share')}<\/button><\/div><p class=\"not-order\">${icon('info')} Iba katal\\u00f3g. Navrhovan\\u00e1 cena, nie online objedn\\u00e1vka.<\/p>\n      <div class=\"ingredient-panel\"><details open><summary>\\u010co je vo vn\\u00fatri ${icon('chevron')}<\/summary><p>${product.ingredients.map(escape).join(' \\u00b7 ')}<\/p><\/details><details><summary>Navrhovan\\u00e9 alerg\\u00e9ny ${icon('chevron')}<\/summary><div>${allergenMarkup}<\/div><p class=\"allergen-warning\">\\u0160kolsk\\u00fd n\\u00e1vrh. Pred skuto\\u010dn\\u00fdm predajom je potrebn\\u00e9 overi\\u0165 recept\\u00fary, dod\\u00e1vate\\u013eov aj mo\\u017en\\u00fa kr\\u00ed\\u017eov\\u00fa kontamin\\u00e1ciu.<\/p><\/details><\/div>\n      ${pair ? `<a class=\"pair-box\" href=\"${productUrl(pair.id)}\">${image(pair)}<div><small>HOD\\u00cd SA K TOMU<\/small><strong>${escape(pair.name)}<\/strong><\/div><span>${money(pair.price)}<\/span>${icon('arrow-up')}<\/a>` : ''}<\/div><\/div>`;\n      updateFavorites();\n      $('#share-product').addEventListener('click',async () => {\n        const success = await copyText(preview ? window.parent.location.href : window.location.href);\n        toast(success ? 'Odkaz na produkt je skop\\u00edrovan\\u00fd.' : 'Kop\\u00edrovanie je zablokovan\\u00e9. Skop\\u00edruj odkaz z adresn\\u00e9ho riadka.');\n      });\n      const related = [...products.filter(p => p.category === product.category && p.id !== product.id), ...products.filter(p => p.featured && p.id !== product.id && p.category !== product.category)].slice(0,4);\n      $('#related-products').innerHTML = related.map(card).join('');\n      $('#related-section').hidden = false;\n    }\n  }\n\n  async function copyText(text) {\n    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (_) { /* try legacy selection */ }\n    const textarea = document.createElement('textarea');\n    textarea.value = text; textarea.setAttribute('readonly','');\n    textarea.style.cssText = 'position:fixed;left:-9999px;top:0';\n    document.body.appendChild(textarea);\n    const active = document.activeElement;\n    textarea.select();\n    let copied = false;\n    try { copied = document.execCommand('copy'); } catch (_) { copied = false; }\n    textarea.remove();\n    if (active && typeof active.focus === 'function') active.focus();\n    return copied;\n  }\n  const addressButton = $('#copy-address');\n  if (addressButton) addressButton.addEventListener('click', async () => {\n    const copied = await copyText('Ekonomick\\u00e1 fakulta UMB, Tajovsk\\u00e9ho 10, 975 90 Bansk\\u00e1 Bystrica');\n    toast(copied ? 'Adresa fakulty je skop\\u00edrovan\\u00e1.' : 'Kop\\u00edrovanie je zablokovan\\u00e9. Adresu m\\u00f4\\u017ee\\u0161 ozna\\u010di\\u0165 a skop\\u00edrova\\u0165 ru\\u010dne.');\n  });\n  const mapButton = $('#load-map');\n  if (mapButton) mapButton.addEventListener('click', () => {\n    const iframe = document.createElement('iframe');\n    iframe.title = 'Mapa Ekonomickej fakulty UMB, Tajovsk\\u00e9ho 10';\n    iframe.referrerPolicy = 'no-referrer';\n    iframe.src = 'https://www.openstreetmap.org/export/embed.html?bbox=19.1328%2C48.7362%2C19.1430%2C48.7410&layer=mapnik&marker=48.738708%2C19.137851';\n    iframe.loading = 'eager';\n    const parent = $('.map-preview');\n    parent.replaceChildren(iframe);\n    iframe.focus();\n    // A permanent external link remains available below the map if embedding is blocked.\n  });\n  const clearButton = $('#clear-storage');\n  if (clearButton) clearButton.addEventListener('click',() => {\n    let success = true;\n    Object.values(storageKeys).forEach(key => {\n      memory.delete(key);\n      try { persistentStorage().removeItem(key); } catch (_) { success = false; }\n    });\n    favorites = new Set(); updateFavorites();\n    toast(success ? 'Ob\\u013e\\u00faben\\u00e9 polo\\u017eky aj ulo\\u017een\\u00e9 kombo s\\u00fa vymazan\\u00e9.' : 'Vo\\u013eby tejto n\\u00e1v\\u0161tevy s\\u00fa vymazan\\u00e9. K \\u00falo\\u017eisku prehliada\\u010da nie je pr\\u00edstup.');\n  });\n  const printButton = $('#print-menu');\n  if (printButton) printButton.addEventListener('click', () => window.print());\n})();\n<\/script><\/body><\/html>", "index.html": "<!doctype html><html lang=\"sk\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>RÁNO. | Raňajkáreň na EF UMB<\/title><meta name=\"description\" content=\"Slané croissanty, plnené bagle a káva. Študentský koncept raňajkárne na EF UMB v Banskej Bystrici.\"><meta name=\"theme-color\" content=\"#283e34\"><meta name=\"robots\" content=\"noindex, nofollow\"><meta property=\"og:title\" content=\"RÁNO. | Raňajkáreň na EF UMB\"><meta property=\"og:description\" content=\"Slané croissanty, plnené bagle a káva. Študentský koncept raňajkárne na EF UMB v Banskej Bystrici.\"><meta property=\"og:type\" content=\"website\"><meta property=\"og:locale\" content=\"sk_SK\"><l t === first) { event.preventDefault(); last.focus(); }\n        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }\n      }\n    });\n    window.matchMedia('(min-width: 961px)').addEventListener('change', event => { if (event.matches) closeNav(); });\n    document.addEventListener('click', event => {\n      if (!mobileNav.hidden && !event.composedPath().includes(header)) closeNav();\n    });\n  }\n  const header = $('.site-header');\n  if (header) {\n    const updateHeader = () => header.classList.toggle('is-scrolled', window.scrollY > 20);\n    window.addEventListener('scroll', updateHeader, { passive:true });\n    updateHeader();\n  }\n\n  const featuredGrid = $('[data-featured]');\n  if (featuredGrid) featuredGrid.innerHTML = products.filter(p => p.featured).map(card).join('');\n\n  // Catalog filters are reflected in the URL and can be shared/bookmarked.\n  if (page === 'menu') {\n    const searchInput = $('#menu-search');\n    const grid = $('#menu-grid');\n    const empty = $('#empty-state');\n    const vegetarianButton = $('#vegetarian-filter');\n    const favoritesButton = $('#favorites-filter');\n    const sort = $('#menu-sort');\n    const validSorts = new Set(['default','price-asc','price-desc','name']);\n    function stateFromURL() {\n      const params = new URLSearchParams(currentURL().search);\n      const category = params.get('kategoria');\n      const order = params.get('zoradenie');\n      return { category:categories[category] ? category : 'vsetko', query:(params.get('hladat') || '').slice(0,100), vegetarian:params.get('vegetarianske') === '1', favorites:params.get('oblubene') === '1', sort:validSorts.has(order) ? order : 'default' };\n    }\n    function updateURL() {\n      const params = new URLSearchParams();\n      if (menuState.category !== 'vsetko') params.set('kategoria', menuState.category);\n      if (menuState.query) params.set('hladat', menuState.query);\n      if (menuState.vegetarian) params.set('vegetarianske', '1');\n      if (menuState.favorites) params.set('oblubene', '1');\n      if (menuState.sort !== 'default') params.set('zoradenie', menuState.sort);\n      const query = params.toString();\n      try {\n        const next = `menu.html${query ? '?' + query : ''}${currentURL().hash}`;\n        if (preview) preview.updateURL(next);\n        else history.replaceState(null, '', next);\n      } catch (_) { /* file:// previews may restrict History API */ }\n    }\n    renderMenu = () => {\n      let visible = products.filter(product => {\n        if (menuState.category !== 'vsetko' && product.category !== menuState.category) return false;\n        if (menuState.vegetarian && !product.vegetarian) return false;\n        if (menuState.favorites && !favorites.has(product.id)) return false;\n        const haystack = normalized(`${product.name} ${product.description} ${product.ingredients.join(' ')} ${categories[product.category]}`);\n        return !menuState.query.trim() || normalized(menuState.query.trim()).split(/\\s+/).every(word => haystack.includes(word));\n      });\n      if (menuState.sort === 'price-asc') visible.sort((a,b) => a.price - b.price);\n      if (menuState.sort === 'price-desc') visible.sort((a,b) => b.price - a.price);\n      if (menuState.sort === 'name') visible.sort((a,b) => a.name.localeCompare(b.name,'sk'));\n      grid.innerHTML = visible.map(card).join('');\n      grid.hidden = visible.length === 0;\n      empty.hidden = visible.length !== 0;\n      $('#result-count').textContent = `Zobrazen\\u00e9: ${visible.length} / ${products.length}`;\n      $('#empty-message').textContent = menuState.favorites && favorites.size === 0 ? 'Zatia\\u013e nem\\u00e1\\u0161 ulo\\u017een\\u00e9 \\u017eiadne jedlo. Pridaj si ho kliknut\\u00edm na srdie\\u010dko pri produkte.' : 'Sk\\u00fas in\\u00fd v\\u00fdraz alebo zru\\u0161 niektor\\u00fd filter.';\n      $$('[data-category]').forEach(button => {\n        const active = button.dataset.category === menuState.category;\n        button.classList.toggle('active', active);\n        button.setAttribute('aria-pressed', String(active));\n      });\n      vegetarianButton.setAttribute('aria-pressed', String(menuState.vegetarian));\n      favoritesButton.setAttribute('aria-pressed', String(menuState.favorites));\n      if (searchInput.value !== menuState.query) searchInput.value = menuState.query;\n      sort.value = menuState.sort;\n      updateURL();\n    };\n    menuState = stateFromURL();\n    renderMenu();\n    $$('[data-category]').forEach(button => button.addEventListener('click', () => {\n      menuState.category = button.dataset.category;\n      renderMenu();\n    }));\n    let searchTimer;\n    searchInput.addEventListener('input', () => {\n      clearTimeout(searchTimer);\n      menuState.query = searchInput.value.slice(0,100);\n      searchTimer = setTimeout(renderMenu, 100);\n    });\n    vegetarianButton.addEventListener('click', () => { menuState.vegetarian = !menuState.vegetarian; renderMenu(); });\n    favoritesButton.addEventListener('click', () => { menuState.favorites = !menuState.favorites; renderMenu(); });\n    sort.addEventListener('change', () => { menuState.sort = validSorts.has(sort.value) ? sort.value : 'default'; renderMenu(); });\n    $('#reset-filters').addEventListener('click', () => {\n      clearTimeout(searchTimer);\n      menuState = { category:'vsetko', query:'', vegetarian:false, favorites:false, sort:'default' };\n      renderMenu(); searchInput.focus();\n    });\n    window.addEventListener('popstate', () => { menuState = stateFromURL(); renderMenu(); });\n    document.addEventListener('keydown', event => {\n      if (event.key === '/' && !event.metaKey && !event.ctrlKey && !event.altKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable) {\n        event.preventDefault(); searchInput.focus();\n      }\n    });\n  }\n\n  // Native dialog provides keyboard focus trapping and Escape semantics.\n  const quickDialog = document.createElement('dialog');\n  quickDialog.className = 'quick-dialog';\n  quickDialog.setAttribute('aria-labelledby','quick-title');\n  document.body.appendChild(quickDialog);\n  function openQuickView(id) {\n    const product = products.find(p => p.id === id);\n    if (!product) return;\n    quickDialog.innerHTML = `<button type=\"button\" class=\"icon-button dialog-close\" aria-label=\"Zatvori\\u0165 n\\u00e1h\\u013ead\" autofocus>${icon('close')}<\/button><div class=\"quick-dialog-grid\">${image(product,'quick-dialog-photo',true)}<div class=\"quick-dialog-copy\"><span class=\"eyebrow\">${escape(categories[product.category])} \\u00b7 ${escape(product.weight)}<\/span><h2 id=\"quick-title\">${escape(product.name)}<\/h2><p>${escape(product.description)}<\/p><span class=\"detail-price\">${money(product.price)}<\/span><p class=\"small-copy\">Navrhovan\\u00e9 alerg\\u00e9ny: ${product.allergens.length ? product.allergens.join(', ') : '\\u017eiadne v zlo\\u017een\\u00ed'}.<br>Fotografia je ilustra\\u010dn\\u00e1.<\/p><a href=\"${productUrl(product.id)}\" class=\"button\">Zlo\\u017eenie a cel\\u00fd detail ${icon('arrow')}<\/a><\/div><\/div>`;\n    $('.dialog-close',quickDialog).addEventListener('click', () => quickDialog.close());\n    if (typeof quickDialog.showModal === 'function') {\n      quickDialog.showModal(); document.body.classList.add('dialog-open');\n    } else { if (preview) preview.navigate(productUrl(id)); else window.location.href = productUrl(id); }\n  }\n  quickDialog.addEventListener('close', () => document.body.classList.remove('dialog-open'));\n  quickDialog.addEventListener('click', event => {\n    if (event.target !== quickDialog) return;\n    const box = quickDialog.getBoundingClientRect();\n    if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) quickDialog.close();\n  });\n\n  // Breakfast combo uses cents for exact arithmetic, and never submits an order.\n  const comboForm = $('#combo-form');\n  if (comboForm) {\n    const food = $('#combo-food');\n    const drink = $('#combo-drink');\n    const save = $('#combo-save');\n    const foodProducts = products.filter(p => p.category !== 'napoje');\n    const drinkProducts = products.filter(p => ['cappuccino','flat-white','espresso'].includes(p.id));\n    const option = p => `<option value=\"${p.id}\">${escape(p.name)} \\u00b7 ${money(p.price)}<\/option>`;\n    food.innerHTML = foodProducts.map(option).join('');\n    drink.innerHTML = drinkProducts.map(option).join('');\n    const stored = readStored(storageKeys.combo, null);\n    if (stored && typeof stored === 'object') {\n      if (foodProducts.some(p => p.id === stored.food)) food.value = stored.food;\n      if (drinkProducts.some(p => p.id === stored.drink)) drink.value = stored.drink;\n    }\n    function updateCombo() {\n      const main = foodProducts.find(p => p.id === food.value);\n      const beverage = drinkProducts.find(p => p.id === drink.value);\n      if (!main || !beverage) return;\n      const originalCents = Math.round(main.price*100) + Math.round(beverage.price*100);\n      $('#combo-price').textContent = money((originalCents - 70)/100);\n      $('#combo-original').textContent = money(originalCents/100);\n      const current = readStored(storageKeys.combo, null);\n      const saved = current && current.food === food.value && current.drink === drink.value;\n      save.innerHTML = `${saved ? 'Tvoj v\\u00fdber je ulo\\u017een\\u00fd' : 'Ulo\\u017ei\\u0165 m\\u00f4j v\\u00fdber'} ${icon(saved ? 'check' : 'heart')}`;\n    }\n    food.addEventListener('change',updateCombo);\n    drink.addEventListener('change',updateCombo);\n    comboForm.addEventListener('submit',event => event.preventDefault());\n    save.addEventListener('click',() => {\n      const persisted = store(storageKeys.combo, { food:food.value, drink:drink.value });\n      updateCombo();\n      toast(persisted ? 'Kombo je ulo\\u017een\\u00e9 v tomto prehliada\\u010di. Nie je to objedn\\u00e1vka.' : 'V\\u00fdber zostane iba po\\u010das tejto n\\u00e1v\\u0161tevy. Prehliada\\u010d blokuje ukladanie.');\n    });\n    updateCombo();\n  }\n\n  if (page === 'product') {\n    const id = new URLSearchParams(currentURL().search).get('id');\n    const product = products.find(p => p.id === id);\n    const target = $('#product-detail');\n    if (!product) {\n      target.innerHTML = `<div class=\"product-not-found\"><span class=\"eyebrow\">TAK\\u00ddTO PRODUKT TU NIE JE<\/span><h1>Vyber si nie\\u010do<br>z <em>n\\u00e1\\u0161ho menu.<\/em><\/h1><p>Odkaz je neplatn\\u00fd alebo sa produkt zmenil.<\/p><a href=\"menu.html\" class=\"button\">Sp\\u00e4\\u0165 do menu ${icon('arrow')}<\/a><\/div>`;\n      document.title = 'Produkt sa nena\\u0161iel | R\\u00c1NO.';\n    } else {\n      document.title = `${product.name} | R\\u00c1NO.`;\n      const description = $('meta[name=\"description\"]');\n      if (description) description.setAttribute('content',product.description);\n      const pair = products.find(p => p.id === product.pair);\n      const allergenMarkup = product.allergens.length ? product.allergens.map(a => `<span class=\"allergen-label\">${a} \\u2014 ${escape(allergens[a] || '')}<\/span>`).join(' ') : '<p>Navrhovan\\u00e9 zlo\\u017eenie neobsahuje deklarovan\\u00e9 alerg\\u00e9ny.<\/p>';\n      target.innerHTML = `<nav class=\"breadcrumbs\" aria-label=\"Navig\\u00e1cia v \\u0161trukt\\u00fare webu\"><a href=\"index.html\">Domov<\/a><span>/<\/span><a href=\"menu.html\">Na\\u0161e menu<\/a><span>/<\/span><a href=\"menu.html?kategoria=${product.category}\">${escape(categories[product.category])}<\/a><span>/<\/span><span>${escape(product.name)}<\/span><\/nav>\n      <div class=\"product-detail-grid\"><div class=\"product-detail-image\">${image(product,'',true)}<span class=\"image-caption\">Ilustra\\u010dn\\u00e1 fotografia. Navrhnut\\u00e1 recept\\u00fara sa m\\u00f4\\u017ee vizu\\u00e1lne l\\u00ed\\u0161i\\u0165.<\/span><\/div>\n      <div class=\"product-detail-copy\"><span class=\"eyebrow\">${escape(categories[product.category])}<\/span><h1>${escape(product.name)}<\/h1><div class=\"product-detail-meta\"><span>${escape(product.weight)}<\/span>${product.vegetarian ? `<span class=\"diet-tag\">${icon('leaf')} ${product.vegan ? 'Rastlinn\\u00e9' : 'Vegetari\\u00e1nske'}<\/span>` : ''}<\/div><span class=\"detail-price\">${money(product.price)}<\/span><p class=\"product-detail-description\">${escape(product.description)}<\/p>\n      <div class=\"detail-actions\"><button type=\"button\" class=\"button button-outline\" data-favorite=\"${product.id}\" aria-pressed=\"${favorites.has(product.id)}\"><span data-favorite-label>Ulo\\u017ei\\u0165 medzi ob\\u013e\\u00faben\\u00e9<\/span>${icon('heart')}<\/button><button type=\"button\" class=\"icon-button\" id=\"share-product\" aria-label=\"Skop\\u00edrova\\u0165 odkaz na produkt\">${icon('share')}<\/button><\/div><p class=\"not-order\">${icon('info')} Iba katal\\u00f3g. Navrhovan\\u00e1 cena, nie online objedn\\u00e1vka.<\/p>\n      <div class=\"ingredient-panel\"><details open><summary>\\u010co je vo vn\\u00fatri ${icon('chevron')}<\/summary><p>${product.ingredients.map(escape).join(' \\u00b7 ')}<\/p><\/details><details><summary>Navrhovan\\u00e9 alerg\\u00e9ny ${icon('chevron')}<\/summary><div>${allergenMarkup}<\/div><p class=\"allergen-warning\">\\u0160kolsk\\u00fd n\\u00e1vrh. Pred skuto\\u010dn\\u00fdm predajom je potrebn\\u00e9 overi\\u0165 recept\\u00fary, dod\\u00e1vate\\u013eov aj mo\\u017en\\u00fa kr\\u00ed\\u017eov\\u00fa kontamin\\u00e1ciu.<\/p><\/details><\/div>\n      ${pair ? `<a class=\"pair-box\" href=\"${productUrl(pair.id)}\">${image(pair)}<div><small>HOD\\u00cd SA K TOMU<\/small><strong>${escape(pair.name)}<\/strong><\/div><span>${money(pair.price)}<\/span>${icon('arrow-up')}<\/a>` : ''}<\/div><\/div>`;\n      updateFavorites();\n      $('#share-product').addEventListener('click',async () => {\n        const success = await copyText(preview ? window.parent.location.href : window.location.href);\n        toast(success ? 'Odkaz na produkt je skop\\u00edrovan\\u00fd.' : 'Kop\\u00edrovanie je zablokovan\\u00e9. Skop\\u00edruj odkaz z adresn\\u00e9ho riadka.');\n      });\n      const related = [...products.filter(p => p.category === product.category && p.id !== product.id), ...products.filter(p => p.featured && p.id !== product.id && p.category !== product.category)].slice(0,4);\n      $('#related-products').innerHTML = related.map(card).join('');\n      $('#related-section').hidden = false;\n    }\n  }\n\n  async function copyText(text) {\n    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (_) { /* try legacy selection */ }\n    const textarea = document.createElement('textarea');\n    textarea.value = text; textarea.setAttribute('readonly','');\n    textarea.style.cssText = 'position:fixed;left:-9999px;top:0';\n    document.body.appendChild(textarea);\n    const active = document.activeElement;\n    textarea.select();\n    let copied = false;\n    try { copied = document.execCommand('copy'); } catch (_) { copied = false; }\n    textarea.remove();\n    if (active && typeof active.focus === 'function') active.focus();\n    return copied;\n  }\n  const addressButton = $('#copy-address');\n  if (addressButton) addressButton.addEventListener('click', async () => {\n    const copied = await copyText('Ekonomick\\u00e1 fakulta UMB, Tajovsk\\u00e9ho 10, 975 90 Bansk\\u00e1 Bystrica');\n    toast(copied ? 'Adresa fakulty je skop\\u00edrovan\\u00e1.' : 'Kop\\u00edrovanie je zablokovan\\u00e9. Adresu m\\u00f4\\u017ee\\u0161 ozna\\u010di\\u0165 a skop\\u00edrova\\u0165 ru\\u010dne.');\n  });\n  const mapButton = $('#load-map');\n  if (mapButton) mapButton.addEventListener('click', () => {\n    const iframe = document.createElement('iframe');\n    iframe.title = 'Mapa Ekonomickej fakulty UMB, Tajovsk\\u00e9ho 10';\n    iframe.referrerPolicy = 'no-referrer';\n    iframe.src = 'https://www.openstreetmap.org/export/embed.html?bbox=19.1328%2C48.7362%2C19.1430%2C48.7410&layer=mapnik&marker=48.738708%2C19.137851';\n    iframe.loading = 'eager';\n    const parent = $('.map-preview');\n    parent.replaceChildren(iframe);\n    iframe.focus();\n    // A permanent external link remains available below the map if embedding is blocked.\n  });\n  const clearButton = $('#clear-storage');\n  if (clearButton) clearButton.addEventListener('click',() => {\n    let success = true;\n    Object.values(storageKeys).forEach(key => {\n      memory.delete(key);\n      try { persistentStorage().removeItem(key); } catch (_) { success = false; }\n    });\n    favorites = new Set(); updateFavorites();\n    toast(success ? 'Ob\\u013e\\u00faben\\u00e9 polo\\u017eky aj ulo\\u017een\\u00e9 kombo s\\u00fa vymazan\\u00e9.' : 'Vo\\u013eby tejto n\\u00e1v\\u0161tevy s\\u00fa vymazan\\u00e9. K \\u00falo\\u017eisku prehliada\\u010da nie je pr\\u00edstup.');\n  });\n  const printButton = $('#print-menu');\n  if (printButton) printButton.addEventListener('click', () => window.print());\n})();\n<\/script><\/body><\/html>", "projekt.html": "<!doctype html><html lang=\"sk\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>O projekte a fotografiách | RÁNO.<\/title><meta name=\"description\" content=\"Informácie o študentskom projekte, ilustračných fotografiách a lokálnom ukladaní obľúbených položiek.\"><meta name=\"theme-color\" content=\"#283e34\"><meta name=\"robots\" content=\"noindex, nofollow\"><meta property=\"og:title\" content=\"O projekte a fotografiách | RÁNO.\"><meta property=\"og:description\" content=\"Informácie o študentskom projekte, ilustračných fotografiách a lokálnom ukladaní obľúbených položiek.\"><meta property=\"og:type\" content=\"website\"><meta property=\"og:locale\" content=\"sk_SK\"><link rel=\"icon\" href= currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12h15M13 5l7 7-7 7\"/><\/svg><\/a><a href=\"index.html#kombo\">Raňajkové kombo<svg class=\"icon \" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12h15M13 5l7 7-7 7\"/><\/svg><\/a><a href=\"o-nas.html\">O nás<svg class=\"icon \" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12h15M13 5l7 7-7 7\"/><\/svg><\/a><a href=\"kontakt.html\">Kde nás nájdeš<svg class=\"icon \" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12h15M13 5l7 7-7 7\"/><\/svg><\/a><p>EF UMB · Tajovského 10, Banská Bystrica<\/p><\/nav><\/header><main id=\"main\"><section class=\"page-intro container\"><nav class=\"breadcrumbs\" aria-label=\"Navigácia v štruktúre webu\"><a href=\"index.html\">Domov<\/a><span>/<\/span><span>O projekte<\/span><\/nav><span class=\"eyebrow\">TRANSPARENTNE<\/span><h1>O tomto <em>projekte.<\/em><\/h1><\/section><article class=\"container prose\"><h2>Študentský koncept<\/h2><p>RÁNO. je fiktívna značka vytvorená pre školský podnikateľský projekt raňajkárne v objekte Ekonomickej fakulty Univerzity Mateja Bela v Banskej Bystrici. Nie je to oficiálna stránka univerzity ani oznámenie o otvorenej prevádzke. Nie je deklarované partnerstvo s fakultou.<\/p><h2>Ponuka, ceny a alergény<\/h2><p>Menu, ceny, gramáže, kombinácie a otváracie hodiny sú návrhom. Uvedené alergény vychádzajú z navrhnutého zloženia, nie z overených receptúr. Pred skutočným predajom je potrebné overiť receptúry, zloženie dodávaných surovín aj možné stopy alergénov. Web neprijíma objednávky ani platby.<\/p><h2>Fotografie a inšpirácia<\/h2><p>Foto
